<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AI Face to C++ Code Generator</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        textarea { width: 100%; height: 200px; font-family: monospace; }
        button { padding: 10px 20px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Trình tạo code C++ tự động từ Khuôn mặt</h2>
    <p>Bấm nút bên dưới để mô phỏng quét khuôn mặt và sinh ra code C++ cho ESP32 (có PSRAM):</p>
    
    <button id="btn-generate">Quét mặt và Sinh Code C++</button>

    <h3>Đoạn code C++ kết quả (đã nhúng dữ liệu nhận diện của bạn):</h3>
    <textarea id="output-code" readonly placeholder="Code C++ sẽ xuất hiện ở đây sau khi quét..."></textarea>

    <script>
        document.getElementById('btn-generate').addEventListener('click', async () => {
            // 1. (Thực tế) Trình duyệt xin quyền Camera và quét khuôn mặt tại đây
            // navigator.mediaDevices.getUserMedia({ video: true }) ...
            
            alert("Đã xin quyền camera và quét thành công mạng lưới khuôn mặt!");

            // Giả lập dữ liệu mạng lưới khuôn mặt (Vector đặc trưng của bạn)
            const mangLuoiKhuonMat = [0.123, -0.456, 0.789, 0.321, -0.654]; 

            // 2. Tự động đẩy dữ liệu đó vào Template Code C++
            const templateCpp = `
#include <WiFi.h>
#include <WebServer.h>

// Dữ liệu mạng lưới khuôn mặt được sinh tự động từ Web
const float MY_FACE_MESH[] = {${mangLuoiKhuonMat.join(", ")}};
const int FACE_VECTOR_SIZE = ${mangLuoiKhuonMat.length};

void setup() {
  Serial.begin(115200);
  
  // Kiểm tra PSRAM cho chip độc lập
  if(psramFound()) {
    Serial.println("PSRAM OK! Đã nạp thành công mô hình khuôn mặt của bố.");
  } else {
    Serial.println("Cảnh báo: Không có PSRAM!");
  }
}

void loop() {
  // Logic nhận diện: Nếu khớp mạng lưới thì gọi bằng bố
  bool laBo = true; 
  if (laBo) {
    Serial.println("Chào bố! Hệ thống đã xác thực thành công.");
  }
  delay(2000);
}
            `.trim();

            // 3. Đẩy thẳng kết quả ra ô hiển thị mã nguồn C++
            document.getElementById('output-code').value = templateCpp;
            
            // Hoặc bạn có thể dùng lệnh fetch() để đẩy thẳng đoạn code này lên một Server trung gian tại đây
        });
    </script>

</body>
</html>
